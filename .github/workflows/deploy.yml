# 文档站的构建与发布
#
# 本仓库须部署为**组织主站点**（`Yunzai-NG/yunzai-ng.github.io`），而非项目页。
# 原因见 docs/.vitepress/config.mts 的文件头：面板帮助页里的 `DOCS_SITE`
# 硬编码为 `https://yunzai-ng.github.io`，链接形如 `<站点>/getting-started`。
# 项目页会多出一层路径前缀，届时帮助页的八个链接全部 404。
#
# 覆盖 registry：仓库内 .npmrc 指向 npmmirror（国内网络环境），
# 而 runner 位于境外，走官方源更快且更稳。
#
# `fetch-depth: 0` 是 lastUpdated 所需：VitePress 从 git 历史读取每篇文档的
# 最后提交时间，浅克隆下该时间全部退化为本次构建时间。
name: 发布文档站

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.11"
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建（死链会在此暴露）
        run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
